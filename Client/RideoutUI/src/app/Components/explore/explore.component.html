<div class="explore-page">

    <div class="hero-section text-center py-5">
        <h1>Explore RideOuts</h1>
        <p>Discover ride locations and events near you with our interactive map.</p>
    </div>


    <div class="container mt-4">
        <div class="row">

            <div class="col-12">
                <div id="map-container" class="map-container">
                    <div id="map"></div>
                </div>
            </div>
        </div>

        <hr>
        <div class="container">
            <div class="hud"></div>
        </div>

        <div class="row mt-4 hud-section">
            <div class="col-md-4">
                <div class="hud-item bg-light p-3 rounded shadow-sm">
                    <h4>Free Roam</h4>
                    <ul class="list-unstyled">
                        <li>Event 1: City Park - 2 PM</li>
                        <li>Event 2: Downtown - 4 PM</li>
                        <li>Event 3: Speedway - 6 PM</li>
                    </ul>
                </div>
            </div>
            <div class="col-md-4">
                <div class="hud-item bg-light p-3 rounded shadow-sm">
                    <h4>Join Rideout</h4>
                    <p id="user-location">Loading...</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="hud-item bg-light p-3 rounded shadow-sm">
                    <h4>Host Rideout</h4>
                    <button class="btn btn-outline-primary btn-sm me-2">Show Events</button>
                    <button class="btn btn-outline-secondary btn-sm">Clear Filters</button>
                </div>
            </div>
        </div>
    </div>
</div>
